[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "ba-certification-finder"
version = "1.0.1"
description = "Get a personalized Business Analysis career path: certification, skills roadmap and courses. Same rules engine as the Techcanvass browser extension and WordPress plugin."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
authors = [{ name = "Techcanvass" }]
keywords = ["iiba", "cbap", "ccba", "ecba", "business analysis", "certification", "pmi-pba"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]
# V8 engine that runs the shared core. Prebuilt for Windows, macOS and Linux (x86_64 + ARM).
dependencies = ["mini-racer>=0.12,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ba-cert-finder = "ba_cert_finder.cli:main"

[project.urls]
Homepage = "https://www.techcanvass.com"

[tool.hatch.build.targets.wheel]
packages = ["src/ba_cert_finder"]

[tool.hatch.build]
# _assets/ is generated by `pnpm --filter python-package sync` and git-ignored; ship it anyway.
artifacts = ["src/ba_cert_finder/_assets/*.js", "src/ba_cert_finder/_assets/*.json"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
