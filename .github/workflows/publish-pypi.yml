# Publishes the Python package to PyPI when you push a tag like  py-v1.0.1
# Uses PyPI Trusted Publishing: no password or API token is stored anywhere.
# One-time setup (see README → "Publish to PyPI"):
#   1. On pypi.org → Account → Publishing → add a pending publisher:
#        project ba-certification-finder, this repo, workflow publish-pypi.yml, environment pypi
#   2. On GitHub → Settings → Environments → New "pypi" → require reviewers (you).
name: Publish to PyPI

on:
  push:
    tags: ["py-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build:py
      - name: Test and build
        working-directory: apps/python-package
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[test]"
          python -m pytest -q
          python -m build
          python -m twine check dist/*
      - name: Tag matches package version
        working-directory: apps/python-package
        run: |
          V=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "py-v$V" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} != py-v$V in pyproject.toml"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: apps/python-package/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ba-certification-finder
    permissions:
      id-token: write # mandatory for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
