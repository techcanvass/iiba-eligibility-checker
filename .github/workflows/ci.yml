name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pnpm install --frozen-lockfile

      # Shared core: unit tests + golden cases (TypeScript)
      - run: pnpm test
      - run: pnpm typecheck

      # Build every platform from the one core
      - run: pnpm build:core
      - run: pnpm build:web
      - run: pnpm build:ext
      - run: npx --prefix apps/browser-extension web-ext lint --source-dir apps/browser-extension/.output/firefox-mv3
      - run: php -l apps/wordpress-plugin/ba-certification-finder.php && php apps/wordpress-plugin/tests/smoke-test.php
      - run: pnpm --filter wordpress-plugin package
      # WordPress.org rule: the shipped source/ folder must rebuild the shipped JS exactly
      - run: pnpm --filter wordpress-plugin source:verify
      - run: pnpm build:gws
      - run: pnpm build:py

      # Built bundles (Python + Apps Script) must give the golden answers too
      - run: pnpm verify:bundles

      # Python package: same golden cases through V8, then build + metadata check
      - name: Python tests and build
        working-directory: apps/python-package
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e ".[test]"
          python -m pytest -q
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          include-hidden-files: true # extension zips live in the hidden .output/ folder
          path: |
            apps/browser-extension/.output/*.zip
            apps/wordpress-plugin/dist/*.zip
            apps/python-package/dist/*
            apps/google-workspace/dist/
